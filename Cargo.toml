[workspace]
resolver = "2"
members = [
    "crates/pahdk-core",
    "crates/pahdk-install",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/pantheon-org/pantheon-agentic-harness-dev-kit"
rust-version = "1.96"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
pahdk-core = { path = "crates/pahdk-core" }
