[package]
name = "pahdk-core"
version = "0.1.0-rc.4"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Pantheon Agentic Harness Dev Kit (PAHDK) core: shared configuration, error types, structured output and filesystem helpers for agent-harness tools."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
serde_yaml_ng = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }

[features]
# Document validation against a JSON Schema and a heading list. Off by default
# so tools that do not validate do not build the JSON Schema crate.
validate = ["dep:jsonschema", "dep:serde_yaml_ng"]

[dev-dependencies]
tempfile = { workspace = true }
